{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="login-wrap">
    <div class="login-banner">
        <h1>{{ SITE_NAME }}</h1>
    </div>

    <form class="card login-card" method="POST" action="{{ url_for('login') }}">
        <p class="muted center-text login-subtitle">Sign in to continue</p>

        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit" class="btn btn-primary btn-full">Log in</button>

        <p class="muted center-text">
            Don't have an account? <a href="{{ url_for('register') }}">Create one</a>
        </p>
    </form>
</div>
{% endblock %}
