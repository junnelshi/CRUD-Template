{% extends "base.html" %}
{% block title %}My Account{% endblock %}
{% block content %}

<h1>My Account</h1>

<div class="card">
    <h2>Profile</h2>
    <form method="POST" action="{{ url_for('edit_account') }}" class="form-grid">
        <div>
            <label>First name</label>
            <input type="text" name="firstName" value="{{ user['firstName'] }}" required>
        </div>
        <div>
            <label>Last name</label>
            <input type="text" name="lastName" value="{{ user['lastName'] }}" required>
        </div>
        <div>
            <label>Email</label>
            <input type="email" name="email" value="{{ user['email'] }}" required>
        </div>
        <div>
            <label>Username</label>
            <input type="text" name="username" value="{{ user['username'] }}" required>
        </div>
        <div>
            <label>New password</label>
            <input type="password" name="password" placeholder="Leave blank to keep current password">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save changes</button>
        </div>
    </form>
</div>

<div class="card">
    <h2>Delete account</h2>
    <p class="muted">This permanently removes your account. This cannot be undone.</p>
    <a href="{{ url_for('delete_account') }}" class="btn btn-danger" data-confirm="Delete your account permanently?">
        Delete my account
    </a>
</div>

{% endblock %}
