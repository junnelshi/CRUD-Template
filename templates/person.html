{% extends "base.html" %}
{% block title %}Person{% endblock %}
{% block content %}

<h1>Person</h1>

<div class="card">
    <h2>Add new</h2>
    <form method="POST" action="{{ url_for('person_page') }}" class="form-grid">
        <div>
            <label>Group</label>
            <select name="groupID" required>
                <option value="" disabled selected>Select a group</option>
                {% for g in groups %}
                <option value="{{ g['groupID'] }}">{{ g['groupName'] }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label>First name</label>
            <input type="text" name="personFName" required>
        </div>
        <div>
            <label>Last name</label>
            <input type="text" name="personLName" required>
        </div>
        <div>
            <label>Rate (e.g. 0.10 = 10%)</label>
            <input type="number" step="0.01" name="personRate" required>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Add</button>
        </div>
    </form>
</div>

<div class="card">
    <div class="card-header-row">
        <h2>All records</h2>
        <form method="GET" action="{{ url_for('person_page') }}" class="search-form">
            <input type="text" name="search" placeholder="Search by name..." value="{{ request.args.get('search', '') }}">
            <button type="submit" class="btn btn-secondary">Search</button>
        </form>
    </div>

    <table class="data-table">
        <thead>
            <tr>
                <th>ID</th><th>Group</th><th>First name</th><th>Last name</th><th>Rate</th><th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for p in persons %}
            <tr>
                <form method="POST" action="{{ url_for('edit_person', personID=p['personID']) }}">
                    <td>{{ p['personID'] }}</td>
                    <td>
                        <select name="groupID">
                            {% for g in groups %}
                            <option value="{{ g['groupID'] }}" {% if g['groupID'] == p['groupID'] %}selected{% endif %}>
                                {{ g['groupName'] }}
                            </option>
                            {% endfor %}
                        </select>
                    </td>
                    <td><input type="text" name="personFName" value="{{ p['personFName'] }}"></td>
                    <td><input type="text" name="personLName" value="{{ p['personLName'] }}"></td>
                    <td><input type="number" step="0.01" name="personRate" value="{{ p['personRate'] }}"></td>
                    <td class="row-actions">
                        <button type="submit" class="btn btn-small btn-primary">Update</button>
                        <a href="{{ url_for('delete_person_route', personID=p['personID']) }}"
                           class="btn btn-small btn-danger"
                           data-confirm="Delete this record?">Delete</a>
                    </td>
                </form>
            </tr>
            {% else %}
            <tr><td colspan="6" class="empty-row">No records yet.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
