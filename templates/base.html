<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "CRUD Practice" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main>
        <nav>
            {% for key, item in tables.items() %}<a href="{{ url_for('records', table=key) }}">{{ item.title }}</a>{% endfor %}
            <a href="{{ url_for('borrowing') }}">Borrow / Return</a>
        </nav>
        {% for message in get_flashed_messages() %}<p class="message">{{ message }}</p>{% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
